spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - RemoveResponseHeader=Server
            - RemoveResponseHeader=X-Powered-By
          routes:
            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=2
                - ValidateHeader=X-Client-Version
                - AddResponseHeader=X-Gateway-Node, gateway-server

            - id: order-service-route
              uri: lb://order-service
              predicates:
                - Path=/api/order/**
              filters:
                - StripPrefix=2
                - ValidateHeader=X-Client-Version
                - AddResponseHeader=X-Gateway-Node, gateway-server

            - id: auth-service-route
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=2

            # Admin endpoints restricted to localhost/internal IPs
            - id: admin-route
              uri: lb://user-service
              predicates:
                - Path=/admin/**
                - RemoteAddr=127.0.0.1,192.168.0.0/16
              filters:
                - StripPrefix=1
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379
