spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - RemoveResponseHeader=Server
            - RemoveResponseHeader=X-Powered-By
          routes:
            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=2
                - name: ValidateHeader  #Gateway 会自动去掉 GatewayFilterFactory 后缀，将剩余部分作为过滤器名称
                  args:
                    headerName: X-Client-Version
                - AddResponseHeader=X-Gateway-Node, gateway-server

            - id: order-service-route
              uri: lb://order-service
              predicates:
                - Path=/api/order/**
              filters:
                - StripPrefix=2
                - name: ValidateHeader
                  args:
                    headerName: X-Client-Version
                - AddResponseHeader=X-Gateway-Node, gateway-server

            - id: auth-service-route
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=2
                # auth 路由不做 Client-Version 校验（登录接口需公开访问）
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
